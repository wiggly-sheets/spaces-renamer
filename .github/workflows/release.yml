# Build and publish a GitHub Release with built artifacts.
#
# Trigger: push a tag matching v* (e.g. v1.0.0)
#
# The workflow builds the Apple silicon app + bundle, packages them as a DMG named
# exactly as the Homebrew tap expects (SpacesRenamer-v<version>.dmg) with
# `make release-artifacts`, and creates a GitHub Release with the DMG and the
# checksum file attached. The version comes from the tag and from nowhere
# else: the build stamps it into the bundle and the release fails when the
# bundle reports another version. Release notes are extracted from the
# CHANGELOG section matching the tag, falling back to a generic note when no
# section exists. Stable tags publish stable releases; prerelease tags
# (containing `-`) publish prereleases.
#
# The Homebrew cask lives in the consolidated wiggly-sheets/homebrew-tap tap,
# which renders it from its own template. This repository keeps no cask file,
# and the workflow never writes into the tap.
#
# A non-gating tap test then proves the tap works end-to-end on the arm64
# runner. The tap's cask declares `depends_on arch: :arm64`, so Intel Macs are
# refused by Homebrew instead of installing an app that cannot run there.
#
# Prerequisites for a production-quality release:
#   - Developer ID Application certificate for signing
#   - Notarization via `xcrun notarytool`
# These are not yet implemented.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and release
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the Makefile can read the release tag and the
          # commit count: the build number comes from `git rev-list --count`.
          # The version comes from the tag of this run.
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install GitHub CLI
        run: brew install gh

      - name: Install create-dmg
        run: brew install create-dmg scdoc

      - name: Run regression tests
        run: make test

      - name: Build the release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make release-artifacts VERSION="$VERSION"

      - name: Verify the build
        run: make verify

      - name: Verify app architecture
        run: |
          lipo -info .build/SpacesRenamer.app/Contents/MacOS/SpacesRenamer
          lipo -info .build/DerivedData/Build/Products/Release/spaces-renamer.dylib
          lipo -info .build/SpacesRenamer.app/Contents/PlugIns/spaces-renamer.dylib
          # Apple silicon only: one slice per binary, no Intel slice.
          test "$(lipo -archs .build/SpacesRenamer.app/Contents/MacOS/SpacesRenamer)" = "arm64"
          test "$(lipo -archs .build/DerivedData/Build/Products/Release/spaces-renamer.dylib)" = "arm64e"
          test "$(lipo -archs .build/SpacesRenamer.app/Contents/PlugIns/spaces-renamer.dylib)" = "arm64e"
          for f in injectd loader.dylib lsdinjector.dylib inject; do
            test "$(lipo -archs .build/SpacesRenamer.app/Contents/Resources/mip/$f)" = "arm64e"
          done

      - name: Verify the bundle version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' .build/SpacesRenamer.app/Contents/Info.plist)"
          echo "The bundle reports ${BUNDLE_VERSION} (the tag says ${VERSION})"
          if [[ "$BUNDLE_VERSION" != "$VERSION" ]]; then
            echo "::error::The bundle reports ${BUNDLE_VERSION}, but the tag says ${VERSION}"
            exit 1
          fi

      - name: Create GitHub Release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG=".build/DerivedData/SpacesRenamer-v${VERSION}.dmg"
          NOTES_FILE="$(mktemp)"
          trap 'rm -f "$NOTES_FILE"' EXIT
          scripts/release-notes.sh "$VERSION" > "$NOTES_FILE"
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --title "${GITHUB_REPOSITORY#*/} ${GITHUB_REF_NAME}" \
            --notes-file "$NOTES_FILE" \
            $PRERELEASE
          gh release upload "$GITHUB_REF_NAME" \
            "$DMG" "${DMG}.sha256"

  tap-test:
    name: Homebrew tap test (arm64)
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-15
    # Non-gating: a tap failure must never roll back or block a release.
    continue-on-error: true

    steps:
      - name: Tap, install, and verify version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          brew tap wiggly-sheets/homebrew-tap
          brew trust wiggly-sheets/homebrew-tap
          brew install --cask spacesrenamer
          INSTALLED="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/SpacesRenamer.app/Contents/Info.plist)"
          echo "Installed SpacesRenamer ${INSTALLED} (expected ${VERSION})"
          if [[ "$INSTALLED" != "$VERSION" ]]; then
            echo "::error::Installed version ${INSTALLED} does not match tag version ${VERSION}"
            exit 1
          fi
