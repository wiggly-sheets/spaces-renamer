# Build and publish a GitHub Release with built artifacts.
#
# Trigger: push a tag matching v* (e.g. v1.0.0)
#
# The workflow builds the universal app + bundle, packages them as a zip named
# exactly as the Homebrew cask expects (SpacesRenamer-v<version>.zip), and
# creates a GitHub Release with the archive and checksum attached. Release
# notes are extracted from the CHANGELOG section matching the tag, falling back
# to a generic note when no section exists. Stable tags publish stable
# releases; prerelease tags (containing `-`) publish prereleases.
#
# After the release, stable tags bump homebrew/spacesrenamer.rb (version and
# sha256), commit it to master, and push the same file to the
# wiggly-sheets/homebrew-spacesrenamer tap repo using the existing GH_TOKEN
# secret. Prerelease tags never touch the cask so stable installs stay intact.
#
# A non-gating tap test then proves the tap works end-to-end on the arm64
# runner. Intel (x86_64) verification stays a documented manual pre-release
# check; see docs/release.md.
#
# Prerequisites for a production-quality release:
#   - Developer ID Application certificate for signing
#   - Notarization via `xcrun notarytool`
#   - DMG or signed installer package
# These are not yet implemented.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build, release, and bump cask
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the cask bump can check out master after building
          # from the pushed tag.
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install GitHub CLI
        run: brew install gh

      - name: Build (universal)
        run: make universal

      - name: Verify app architecture
        run: |
          lipo -info .build/DerivedData/Build/Products/Release/SpacesRenamer.app/Contents/MacOS/SpacesRenamer
          lipo -info .build/DerivedData/Build/Products/Release/spaces-renamer.bundle/Contents/MacOS/spaces-renamer

      - name: Create Release Archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE=".build/DerivedData/SpacesRenamer-v${VERSION}.zip"
          ditto -c -k --sequesterRsrc \
            ".build/DerivedData/Build/Products/Release/SpacesRenamer.app" \
            "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Create GitHub Release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE=".build/DerivedData/SpacesRenamer-v${VERSION}.zip"
          NOTES_FILE="$(mktemp)"
          trap 'rm -f "$NOTES_FILE"' EXIT
          scripts/release-notes.sh "$VERSION" > "$NOTES_FILE"
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --title "${GITHUB_REPOSITORY#*/} ${GITHUB_REF_NAME}" \
            --notes-file "$NOTES_FILE" \
            $PRERELEASE
          gh release upload "$GITHUB_REF_NAME" \
            "$ARCHIVE" "${ARCHIVE}.sha256"

      - name: Bump cask and commit to master
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256="$(cut -d' ' -f1 ".build/DerivedData/SpacesRenamer-v${VERSION}.zip.sha256")"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Drop build products touched in the workspace (e.g. the tracked
          # injection payload) before moving from the tag to master.
          git restore .
          git checkout -B master origin/master
          scripts/bump-cask.sh "$VERSION" "$SHA256" homebrew/spacesrenamer.rb
          git diff --check
          git add homebrew/spacesrenamer.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump cask to v${VERSION}"
            git push origin master
          else
            echo "Cask already current for v${VERSION}; nothing to commit."
          fi

      - name: Push cask to tap repo
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAP_REPO="wiggly-sheets/homebrew-spacesrenamer"
          TAP_URL="https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git"
          rm -rf .tap-repo
          git clone --depth 1 "$TAP_URL" .tap-repo
          cp homebrew/spacesrenamer.rb .tap-repo/Formula/spacesrenamer.rb
          git -C .tap-repo config user.name "github-actions[bot]"
          git -C .tap-repo config user.email "github-actions[bot]@users.noreply.github.com"
          git -C .tap-repo add Formula/spacesrenamer.rb
          if ! git -C .tap-repo diff --cached --quiet; then
            git -C .tap-repo commit -m "chore(release): bump cask to v${VERSION}"
            DEFAULT_BRANCH="$(git -C .tap-repo symbolic-ref --short refs/remotes/origin/HEAD)"
            git -C .tap-repo push origin "HEAD:${DEFAULT_BRANCH#origin/}"
          else
            echo "Tap cask already current for v${VERSION}; nothing to commit."
          fi

  tap-test:
    name: Homebrew tap test (arm64)
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-15
    # Non-gating: a tap failure must never roll back or block a release.
    continue-on-error: true

    steps:
      - name: Tap, install, and verify version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          brew tap wiggly-sheets/spacesrenamer
          brew install --cask spacesrenamer
          INSTALLED="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/SpacesRenamer.app/Contents/Info.plist)"
          echo "Installed SpacesRenamer ${INSTALLED} (expected ${VERSION})"
          if [[ "$INSTALLED" != "$VERSION" ]]; then
            echo "::error::Installed version ${INSTALLED} does not match tag version ${VERSION}"
            exit 1
          fi
