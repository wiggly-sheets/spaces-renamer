# Build and publish a GitHub Release with built artifacts.
#
# Trigger: push a tag matching v* (e.g. v1.0.0)
#
# The workflow builds the universal app + bundle, packages them as a zip,
# and creates a GitHub Release with the archive attached.
#
# Prerequisites for a production-quality release:
#   - Developer ID Application certificate for signing
#   - Notarization via `xcrun notarytool`
#   - DMG or signed installer package
# These are not yet implemented.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and package
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install GitHub CLI
        run: brew install gh

      - name: Build (universal)
        run: make universal

      - name: Verify app architecture
        run: |
          lipo -info .build/DerivedData/Build/Products/Release/SpacesRenamer.app/Contents/MacOS/SpacesRenamer
          lipo -info .build/DerivedData/Build/Products/Release/spaces-renamer.bundle/Contents/MacOS/spaces-renamer

      - name: Create Release Archive
        run: |
          cd .build/DerivedData/Build/Products/Release
          ditto -c -k --sequesterRsrc \
            "SpacesRenamer.app" \
            "../../SpacesRenamer-${{ github.ref_name }}.app.zip"
          shasum -a 256 "SpacesRenamer-${{ github.ref_name }}.app.zip" > \
            "../../SpacesRenamer-${{ github.ref_name }}.app.zip.sha256"

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${GITHUB_REPOSITORY#*/} ${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }}" \
            --prerelease
          gh release upload "${{ github.ref_name }}" \
            SpacesRenamer-${{ github.ref_name }}.app.zip \
            SpacesRenamer-${{ github.ref_name }}.app.zip.sha256