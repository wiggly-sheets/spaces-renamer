# Build and publish a GitHub Release with built artifacts.
#
# Trigger: push a tag matching v* (e.g. v1.0.0)
#
# The workflow builds the universal app + bundle, packages them as a zip named
# exactly as the Homebrew cask expects (SpacesRenamer-v<version>.zip), and
# creates a GitHub Release with the archive and checksum attached.
#
# Prerequisites for a production-quality release:
#   - Developer ID Application certificate for signing
#   - Notarization via `xcrun notarytool`
#   - DMG or signed installer package
# These are not yet implemented.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and package
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install GitHub CLI
        run: brew install gh

      - name: Build (universal)
        run: make universal

      - name: Verify app architecture
        run: |
          lipo -info .build/DerivedData/Build/Products/Release/SpacesRenamer.app/Contents/MacOS/SpacesRenamer
          lipo -info .build/DerivedData/Build/Products/Release/spaces-renamer.bundle/Contents/MacOS/spaces-renamer

      - name: Create Release Archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE=".build/DerivedData/SpacesRenamer-v${VERSION}.zip"
          ditto -c -k --sequesterRsrc \
            ".build/DerivedData/Build/Products/Release/SpacesRenamer.app" \
            "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Create GitHub Release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE=".build/DerivedData/SpacesRenamer-v${VERSION}.zip"
          gh release create "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --title "${GITHUB_REPOSITORY#*/} ${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}" \
            --prerelease
          gh release upload "$GITHUB_REF_NAME" \
            "$ARCHIVE" "${ARCHIVE}.sha256"
