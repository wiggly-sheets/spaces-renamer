name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "codex/**"
      - "feat/**"
      - "feature/**"

permissions:
  contents: read

jobs:
  verify:
    name: Tests, universal build, and Dock analyzer
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install build tools
        run: brew install scdoc

      - name: Run regression tests
        run: make test

      - name: Build and verify architectures
        run: make universal

      - name: Analyze the injected Dock bundle
        run: >-
          xcodebuild
          -project spaces-renamer.xcodeproj
          -scheme spaces-renamer
          -configuration Release
          -derivedDataPath .build/Analyze
          CODE_SIGNING_ALLOWED=NO
          'ARCHS=arm64e'
          analyze
